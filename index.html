<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Keep</title>
<style>
  :root {
    --bg: #0f1114;
    --bg-elevated: #161a20;
    --panel: #1c2129;
    --border: #2d3542;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #6b9fff;
    --row-hover: rgba(107, 159, 255, 0.08);
    --row-selected: rgba(107, 159, 255, 0.16);
    --st-editing: #7eb6ff;
    --st-reading: #b89cff;
    --st-running: #6fcf97;
    --st-delegating: #f2c94c;
    --st-thinking: #c8cdd6;
    --st-waiting: #ffb86b;
    --st-stuck: #ff6b6b;
    --st-idle: #8b939e;
    --st-done: #6b7280;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--font);
    min-height: 100vh;
  }
  body.panel-open .app-main { opacity: 0.97; }
  .app-main { transition: opacity 200ms ease-in-out; max-width: 1440px; margin: 0 auto; padding: 16px 18px 32px; }
  @media (prefers-reduced-motion: reduce) { .app-main { transition-duration: 80ms; } }
  header.app-header {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .header-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; margin-bottom: 10px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  #live-status { margin-left: auto; color: var(--muted); font-size: 13px; }
  .summary-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; margin-right: 4px; }
  .chip.state-chip { border-color: transparent; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  #search {
    flex: 1;
    min-width: 180px;
    max-width: 360px;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font: inherit;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .cloud-line { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .cloud-line.ok { color: #6fcf97; }
  .cloud-line.err { color: #ff6b6b; }
  .view-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
  .view-mode-tabs { display: flex; gap: 0; }
  .view-mode-tab {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-elevated); color: var(--muted);
  }
  .view-mode-tab:first-child { border-radius: 6px 0 0 6px; }
  .view-mode-tab:last-child { border-radius: 0 6px 6px 0; }
  .view-mode-tab + .view-mode-tab { margin-left: -1px; }
  .view-mode-tab.active { background: var(--panel); color: var(--text); border-color: var(--accent); z-index: 1; }
  .tier-tabs { display: flex; flex-wrap: wrap; gap: 0; margin-left: auto; }
  .graph-panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    min-height: min(520px, calc(100vh - 260px));
  }
  #graph-wrap { position: relative; width: 100%; height: min(520px, calc(100vh - 260px)); cursor: grab; }
  #graph-wrap.panning { cursor: grabbing; }
  #graph-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .graph-toolbar {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    display: flex; gap: 8px; align-items: center;
  }
  .graph-toolbar .hint { font-size: 11px; color: var(--muted); max-width: 200px; }
  .graph-legend {
    position: absolute; bottom: 10px; right: 10px; z-index: 2;
    font-size: 11px; color: var(--muted);
    background: rgba(15, 17, 20, 0.88);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    pointer-events: none;
  }
  .graph-legend row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .graph-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .graph-legend .ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }
  #graph-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; }
  .tier-tab {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--muted);
  }
  .tier-tab + .tier-tab { margin-left: -1px; }
  .tier-tab:first-child { border-radius: 6px 0 0 6px; }
  .tier-tab:last-child { border-radius: 0 6px 6px 0; }
  .tier-tab.active { background: var(--accent); color: #0f1114; border-color: var(--accent); z-index: 1; }
  .tree-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .table-wrap { overflow: auto; max-height: calc(100vh - 280px); }
  table.tree { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tree th {
    position: sticky;
    top: 0;
    z-index: 2;
    text-align: left;
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }
  table.tree td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  tr.tree-row { cursor: default; }
  tr.tree-row[data-key] { cursor: pointer; }
  tr.tree-row[data-key]:hover { background: var(--row-hover); }
  tr.tree-row.selected { background: var(--row-selected); }
  tr.tree-row.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tr.group-row td { font-weight: 600; color: var(--text); background: rgba(0,0,0,0.15); padding-top: 10px; }
  tr.group-row td .tree-cell { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .tree-cell { display: flex; align-items: center; gap: 0; min-width: 140px; }
  .tree-gutter { flex-shrink: 0; color: var(--border); font-family: var(--mono); font-size: 12px; user-select: none; }
  .depth-0 .tree-gutter { width: 0; }
  .depth-1 .tree-gutter { width: 16px; }
  .depth-2 .tree-gutter { width: 32px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
    color: #fff;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .state-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid currentColor;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  td.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .empty-tier { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .btn {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: #0f1114; border-color: var(--accent); font-weight: 600; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  @keyframes panel-in {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes panel-out {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(12px); }
  }
  #transcript-panel {
    position: fixed; top: 16px; right: 16px; bottom: 16px; z-index: 1000;
    width: min(440px, calc(100vw - 32px));
    display: flex; flex-direction: column;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateX(12px);
  }
  #transcript-panel.panel-visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
  #transcript-panel.panel-motion-in { pointer-events: auto; animation: panel-in 200ms ease-in-out forwards; }
  #transcript-panel.panel-motion-out { pointer-events: none; animation: panel-out 200ms ease-in-out forwards; }
  @media (prefers-reduced-motion: reduce) {
    @keyframes panel-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes panel-out { from { opacity: 1; } to { opacity: 0; } }
    #transcript-panel { transform: none; }
    #transcript-panel.panel-visible { transform: none; }
  }
  #transcript-panel[hidden] { display: none !important; }
  #transcript-panel header {
    display: flex; gap: 12px; padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  #transcript-panel h2 { margin: 0; font-size: 15px; font-weight: 600; }
  #transcript-panel header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  #transcript-close { margin-left: auto; flex-shrink: 0; }
  #transcript-note { margin: 0; padding: 8px 14px 0; font-size: 12px; color: var(--muted); }
  #transcript-pages { overflow: auto; padding: 10px 14px 16px; flex: 1; min-height: 0; }
  #transcript-pages article {
    margin: 0 0 10px; padding: 10px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #transcript-pages h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  #transcript-pages pre { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--font); }
  #transcript-pages article.tool pre { font-family: var(--mono); font-size: 12px; }
  #transcript-pages article.live { border-color: var(--st-editing); }
  #transcript-reply {
    margin: 0; padding: 10px 14px 14px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  #transcript-reply[hidden] { display: none; }
  #transcript-reply textarea {
    width: 100%; min-height: 72px; resize: vertical;
    padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font: inherit;
  }
  #transcript-reply p { margin: 0; color: #ff6b6b; font-size: 12px; }
  .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title-row h2 { margin: 0; flex: 1; min-width: 120px; }
  #transcript-rename-input {
    flex: 1; min-width: 160px; font: inherit; font-size: 15px; font-weight: 600;
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--bg-elevated); color: var(--text);
  }
  #transcript-rename-input[hidden] { display: none !important; }
  .btn-icon { padding: 4px 10px; font-size: 12px; }
  .original-title { margin: 2px 0 0; font-size: 11px; color: var(--muted); font-style: italic; }
  #transcript-reset-name { margin-top: 4px; font-size: 12px; padding: 4px 10px; }
  #transcript-reset-name[hidden] { display: none !important; }
  .ctx-menu {
    position: fixed; z-index: 2000;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    padding: 4px 0;
    min-width: 120px;
  }
  .ctx-menu[hidden] { display: none !important; }
  .ctx-menu button {
    display: block; width: 100%; text-align: left;
    border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 13px; padding: 8px 14px; cursor: pointer;
  }
  .ctx-menu button:hover { background: var(--row-hover); }
</style>
</head>
<body>
<div class="app-main">
  <header class="app-header">
    <div class="header-top">
      <h1 id="app-title">Agent Keep</h1>
      <span id="live-status">Connecting…</span>
    </div>
    <div class="summary-chips" id="summary-chips" aria-live="polite"></div>
    <div class="controls">
      <input type="search" id="search" placeholder="Filter by title, project, or source…" autocomplete="off">
      <label><input type="checkbox" id="show-finished" checked> Show finished subagents</label>
    </div>
    <p class="cloud-line" id="cloud-line"></p>
  </header>
  <div class="view-bar">
    <div class="view-mode-tabs" role="tablist" aria-label="Layout">
      <button type="button" class="view-mode-tab active" data-view="graph" role="tab" aria-selected="true">Graph</button>
      <button type="button" class="view-mode-tab" data-view="tree" role="tab" aria-selected="false">Tree</button>
    </div>
    <div class="tier-tabs" role="tablist" aria-label="Agent tiers">
      <button type="button" class="tier-tab active" data-tier="active" role="tab" aria-selected="true">Active <span id="count-active"></span></button>
      <button type="button" class="tier-tab" data-tier="recent" role="tab" aria-selected="false">Recent <span id="count-recent"></span></button>
      <button type="button" class="tier-tab" data-tier="archive" role="tab" aria-selected="false">Archive <span id="count-archive"></span></button>
    </div>
  </div>
  <section id="graph-panel" class="graph-panel">
    <div class="graph-toolbar">
      <button type="button" id="graph-fit" class="btn">Fit</button>
      <span class="hint">Drag nodes · pan background · scroll to zoom · double-click empty to fit</span>
    </div>
    <div id="graph-wrap"><canvas id="graph-canvas"></canvas><p id="graph-empty" hidden>No agents in this tier.</p></div>
    <div class="graph-legend" id="graph-legend"></div>
  </section>
  <section id="tree-panel-section" class="tree-panel" hidden>
    <div class="table-wrap">
      <table class="tree">
        <thead>
          <tr>
            <th>Agent</th>
            <th>Role</th>
            <th>Title</th>
            <th>State</th>
            <th>Tool</th>
            <th>Last activity</th>
            <th>Subagents</th>
          </tr>
        </thead>
        <tbody id="tree-body"></tbody>
      </table>
    </div>
    <p id="empty-tier" class="empty-tier" hidden>No agents in this tier.</p>
  </section>
</div>

<aside id="transcript-panel" hidden>
  <header>
    <div style="flex:1;min-width:0">
      <div class="title-row" id="transcript-title-view">
        <h2 id="transcript-title">Transcript</h2>
        <button type="button" id="transcript-rename-btn" class="btn btn-icon" title="Rename display name">Rename</button>
      </div>
      <input type="text" id="transcript-rename-input" maxlength="120" hidden aria-label="Display name">
      <p id="transcript-original" class="original-title" hidden></p>
      <button type="button" id="transcript-reset-name" class="btn" hidden>Reset name</button>
      <p id="transcript-sub"></p>
    </div>
    <button type="button" id="transcript-close" class="btn">Close</button>
  </header>
  <p id="transcript-note"></p>
  <div id="transcript-pages"></div>
  <form id="transcript-reply" hidden>
    <label id="transcript-reply-label" for="transcript-input">Reply</label>
    <textarea id="transcript-input" maxlength="4000" placeholder="Send a follow-up…"></textarea>
    <button type="submit" class="btn btn-primary">Send</button>
    <p id="transcript-reply-error"></p>
  </form>
</aside>
<div id="agent-ctx-menu" class="ctx-menu" hidden role="menu">
  <button type="button" data-action="rename">Rename</button>
</div>

<script>
'use strict';

/** Presentation only — swap for a themed skin without changing tree logic. */
const THEME = {
  appTitle: 'Agent Keep',
  groupCloud: 'Cloud',
  groupNoProject: 'No project',
  tiers: { active: 'Active', recent: 'Recent', archive: 'Archive' },
  sources: {
    claude: { label: 'Claude Code', badge: '#c45c4a' },
    cursor: { label: 'Cursor local', badge: '#5b8fd9' },
    cloud: { label: 'Cursor Cloud', badge: '#9b6bd4' },
  },
  departReason: {
    done: 'Finished turn',
    cap: 'Subagent cap',
    quiet: 'Inactive',
    vanished: 'Transcript removed',
    orphan: 'Parent gone',
    cloud_removed: 'Removed from cloud API',
  },
  transcriptRoles: {
    you: 'You',
    scribe: 'Assistant',
    tool: 'Tool',
    question: 'Question',
  },
  stateStyle: {
    editing: { label: 'Working: editing', color: 'var(--st-editing)' },
    reading: { label: 'Working: reading/searching', color: 'var(--st-reading)' },
    running: { label: 'Working: running commands', color: 'var(--st-running)' },
    delegating: { label: 'Working: delegating', color: 'var(--st-delegating)' },
    thinking: { label: 'Working: thinking', color: 'var(--st-thinking)' },
    waitingQuestion: { label: 'Waiting on you: question', color: 'var(--st-waiting)' },
    waitingTurn: { label: 'Waiting on you: your turn', color: 'var(--st-waiting)' },
    stuck: { label: 'Stuck (>10s)', color: 'var(--st-stuck)' },
    idle: { label: 'Idle / asleep', color: 'var(--st-idle)' },
    done: { label: 'Done', color: 'var(--st-done)' },
  },
};

const STUCK_MS = 10_000;
const IDLE_MS = 10 * 60_000;
const CLOUD_GROUP = '__cloud__';
const NO_PROJECT = '__none__';
const PANEL_MOTION_MS = 200;

let snap = { agents: [], departed: [], graveyard: [], cloud: {} };
let tier = 'active';
let panelKey = null;
let panelTimer = null;
let panelArmed = false;
let panelCloseTimer = null;
let searchQuery = '';
let showFinished = true;
let viewMode = 'graph';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function sourceTheme(source) {
  return THEME.sources[source] || { label: source || 'Unknown', badge: '#888' };
}

function fmtAgo(ms) {
  if (ms == null || ms < 0) return '—';
  if (ms < 60e3) return `${Math.round(ms / 1e3)}s ago`;
  if (ms < 3600e3) return `${Math.round(ms / 60e3)}m ago`;
  if (ms < 86_400e3) return `${(ms / 3600e3).toFixed(1)}h ago`;
  const d = Math.round(ms / 86_400e3);
  return d === 1 ? '1 day ago' : `${d} days ago`;
}

function visualState(a) {
  if (a.state === 'done') return 'done';
  if (a.state === 'waiting' && (a.idleForMs ?? 0) > IDLE_MS) return 'idle';
  if ((a.pendingForMs ?? 0) > STUCK_MS && a.state !== 'delegating' && a.state !== 'waiting') return 'stuck';
  return a.state;
}

function plainState(a) {
  const st = visualState(a);
  if (st === 'done') return THEME.stateStyle.done;
  if (st === 'stuck') return THEME.stateStyle.stuck;
  if (st === 'idle') return THEME.stateStyle.idle;
  if (st === 'waiting') {
    return a.summons === 'question' ? THEME.stateStyle.waitingQuestion : THEME.stateStyle.waitingTurn;
  }
  const map = {
    typing: 'editing',
    reading: 'reading',
    running: 'running',
    delegating: 'delegating',
    thinking: 'thinking',
  };
  return THEME.stateStyle[map[st]] || THEME.stateStyle.thinking;
}

function roleLabel(a) {
  if (a.kind === 'session') return 'Parent thread';
  const t = (a.agentType || 'subagent').replace(/([a-z])([A-Z])/g, '$1 $2');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function titleOf(a) {
  if (a.kind === 'session') return a.title || '(untitled thread)';
  return a.title || a.agentType || '(subagent)';
}

function projectGroupKey(session) {
  if (session.project) return session.project;
  if (session.source === 'cloud') return CLOUD_GROUP;
  return NO_PROJECT;
}

function groupLabel(key) {
  if (key === CLOUD_GROUP) return THEME.groupCloud;
  if (key === NO_PROJECT) return THEME.groupNoProject;
  return key;
}

function tierPool(which) {
  if (which === 'active') return snap.agents || [];
  if (which === 'recent') return snap.departed || [];
  return snap.graveyard || [];
}

function agentMeta(key) {
  return (snap.agents || []).find(a => a.key === key)
    || (snap.departed || []).find(a => a.key === key)
    || (snap.graveyard || []).find(a => a.key === key);
}

function matchesSearch(a, q) {
  if (!q) return true;
  const hay = [
    titleOf(a),
    a.originalTitle,
    a.project,
    a.agentType,
    a.branch,
    sourceTheme(a.source).label,
    a.key,
  ].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

function titleTooltip(a) {
  if (!a) return '';
  if (a.renamed && a.originalTitle) return `Display name: ${titleOf(a)}\nOriginal: ${a.originalTitle}`;
  return titleOf(a);
}

let renameEditing = false;

function patchSnapRename(key, data) {
  for (const list of [snap.agents, snap.departed, snap.graveyard]) {
    const a = list?.find(x => x.key === key);
    if (!a) continue;
    a.title = data.title;
    if (data.renamed) {
      a.originalTitle = data.originalTitle;
      a.renamed = true;
    } else {
      delete a.originalTitle;
      delete a.renamed;
    }
  }
}

async function postRename(key, name) {
  const res = await fetch('/rename', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ key, name }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Rename failed');
  patchSnapRename(key, data);
  graphLastSnapSig = '';
  renderAll();
  updateTranscriptHeader();
  return data;
}

function cancelRenameEdit() {

function startRenameEdit() {

function subCounts(sessionKey, pool) {
  const subs = pool.filter(x => x.kind === 'subagent' && x.sessionKey === sessionKey);
  const running = subs.filter(x => x.state !== 'done').length;
  return { running, total: subs.length };
}

function activityMs(a) {
  if (a.state === 'done') return a.finishedForMs ?? a.lastUsedForMs ?? a.departedForMs ?? a.idleForMs;
  if (a.pendingForMs) return a.pendingForMs;
  return a.idleForMs ?? a.lastUsedForMs ?? 0;
}

function buildTree(pool) {
  const q = searchQuery.trim().toLowerCase();
  const sessions = pool.filter(a => a.kind === 'session').sort((a, b) => a.key.localeCompare(b.key));
  const groups = new Map();
  for (const s of sessions) {
    const gk = projectGroupKey(s);
    if (!groups.has(gk)) groups.set(gk, []);
    groups.get(gk).push(s);
  }
  const orphanSubs = pool.filter(a => a.kind === 'subagent' && !sessions.some(s => s.key === a.sessionKey));
  if (orphanSubs.length) {
    if (!groups.has(NO_PROJECT)) groups.set(NO_PROJECT, []);
    for (const o of orphanSubs) {
      if (!groups.get(NO_PROJECT).some(x => x.key === o.sessionKey)) {
        groups.get(NO_PROJECT).push({
          key: o.sessionKey || `orphan:${o.key}`,
          kind: 'session',
          title: '(missing parent)',
          project: null,
          source: o.source,
          state: 'done',
          kindOrphan: true,
        });
      }
    }
  }
  const keys = [...groups.keys()].sort((a, b) => {
    if (a === NO_PROJECT) return 1;
    if (b === NO_PROJECT) return -1;
    if (a === CLOUD_GROUP) return 1;
    if (b === CLOUD_GROUP) return -1;
    return a.localeCompare(b);
  });
  const rows = [];
  for (const gk of keys) {
    const sessList = groups.get(gk);
    let groupVisible = false;
    const groupRows = [];
    for (const s of sessList) {
      let subs = pool.filter(x => x.kind === 'subagent' && x.sessionKey === s.key)
        .sort((a, b) => a.key.localeCompare(b.key));
      if (!showFinished) subs = subs.filter(x => x.state !== 'done');
      const sessionMatch = matchesSearch(s, q);
      const visibleSubs = subs.filter(sub => sessionMatch || matchesSearch(sub, q));
      if (!sessionMatch && !visibleSubs.length) continue;
      groupVisible = true;
      const counts = subCounts(s.key, pool);
      groupRows.push({ type: 'session', depth: 1, agent: s, counts, visibleSubs: sessionMatch ? subs : visibleSubs });
      for (const sub of (sessionMatch ? subs : visibleSubs)) {
        groupRows.push({ type: 'sub', depth: 2, agent: sub });
      }
    }
    if (groupVisible) {
      rows.push({ type: 'group', depth: 0, label: groupLabel(gk) });
      rows.push(...groupRows);
    }
  }
  return rows;
}

function renderTree() {
  const pool = tierPool(tier);
  const rows = buildTree(pool);
  const tbody = document.getElementById('tree-body');
  const empty = document.getElementById('empty-tier');
  if (!rows.length) {
    tbody.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;
  const html = [];
  for (const row of rows) {
    if (row.type === 'group') {
      html.push(`<tr class="tree-row group-row depth-0"><td colspan="7"><div class="tree-cell"><span class="tree-gutter"></span>${esc(row.label)}</div></td></tr>`);
      continue;
    }
    const a = row.agent;
    const src = sourceTheme(a.source);
    const st = plainState(a);
    const gutter = row.depth === 1 ? '├─' : row.depth === 2 ? '└─' : '';
    const badge = `<span class="badge" style="background:${src.badge}">${esc(src.label)}</span>`;
    const keyAttr = a.kindOrphan ? '' : ` data-key="${esc(a.key)}"`;
    const selected = panelKey === a.key ? ' selected' : '';
    const tool = a.tool ? esc(a.tool) : '';
    const activity = fmtAgo(activityMs(a));
    let subsCol = '—';
    if (row.type === 'session' && row.counts) {
      subsCol = row.counts.total
        ? `${row.counts.running} / ${row.counts.total}`
        : '0';
    }
    const projectHint = a.project && row.type === 'session' ? `<span style="color:var(--muted);font-size:12px"> · ${esc(a.project)}</span>` : '';
    const origHint = a.renamed && a.originalTitle
      ? `<div style="font-size:11px;color:var(--muted)">Was: ${esc(a.originalTitle)}</div>` : '';
    html.push(`<tr class="tree-row depth-${row.depth}${selected}"${keyAttr}>
      <td><div class="tree-cell"><span class="tree-gutter">${gutter}</span>${badge}</div></td>
      <td>${esc(roleLabel(a))}</td>
      <td title="${esc(titleTooltip(a))}">${esc(titleOf(a))}${projectHint}${a.branch ? ` <span style="color:var(--muted)">${esc(a.branch)}</span>` : ''}${origHint}</td>
      <td><span class="state-pill" style="color:${st.color}">${esc(st.label)}</span></td>
      <td class="mono">${tool}</td>
      <td>${activity}</td>
      <td>${subsCol}</td>
    </tr>`);
  }
  tbody.innerHTML = html.join('');
}

function countSessions(pool) {

}

function renderSummary() {

// ---------- transcript panel ----------
function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function finishPanelHidden() {
  const el = document.getElementById('transcript-panel');
  el.hidden = true;
  el.classList.remove('panel-visible', 'panel-motion-in', 'panel-motion-out');
  document.body.classList.remove('panel-open');
}

function showPanel() {
  const el = document.getElementById('transcript-panel');
  if (panelCloseTimer) { clearTimeout(panelCloseTimer); panelCloseTimer = null; }
  el.hidden = false;
  document.body.classList.add('panel-open');
  el.classList.remove('panel-motion-out', 'panel-visible', 'panel-motion-in');
  if (prefersReducedMotion()) {
    el.classList.add('panel-visible');
    return;
  }
  void el.offsetWidth;
  el.classList.add('panel-motion-in');
  const onIn = (e) => {
    if (e.target !== el || e.animationName !== 'panel-in') return;
    el.removeEventListener('animationend', onIn);
    el.classList.remove('panel-motion-in');
    el.classList.add('panel-visible');
  };
  el.addEventListener('animationend', onIn);
}

function paintTranscript(data) {
  const agent = agentMeta(data.key);
  const st = agent ? plainState(agent) : THEME.stateStyle.done;
  const src = sourceTheme(agent?.source || data.source);
  document.getElementById('transcript-panel').style.borderColor = src.badge;
  updateTranscriptHeader();
  document.getElementById('transcript-sub').textContent = `${src.label} · ${st.label}`;
  const waiting = agent && (agent.state === 'waiting' || visualState(agent) === 'idle');
  const canReply = agent?.source === 'cloud' && agent.state === 'waiting';
  const note = document.getElementById('transcript-note');
  if (!data.entries?.length && !waiting) note.textContent = 'No transcript pages yet.';
  else if (agent?.summons === 'question') note.textContent = 'This agent asked a question.';
  else if (canReply) note.textContent = 'You can send a follow-up below.';
  else if (waiting) note.textContent = 'Waiting on you. Replies are only supported for Cursor Cloud agents here.';
  else if (data.partial) note.textContent = 'Older content was truncated.';
  else note.textContent = agent && agent.state !== 'done' ? 'Live transcript.' : 'Historical transcript.';
  const reply = document.getElementById('transcript-reply');
  reply.hidden = !canReply;
  document.getElementById('transcript-reply-label').textContent =
    agent?.summons === 'question' ? 'Answer the question' : 'Reply';
  const box = document.getElementById('transcript-pages');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 48;
  const who = THEME.transcriptRoles;
  const live = agent && !['waiting', 'idle', 'done'].includes(visualState(agent));
  box.innerHTML = (data.entries || []).map((entry, i) => {
    const fresh = (live && i === data.entries.length - 1) || entry.role === 'question' ? ' live' : '';
    return `<article class="${esc(entry.role)}${fresh}"><h3>${esc(who[entry.role] || entry.role)}</h3><pre>${esc(entry.text)}</pre></article>`;
  }).join('');
  if (panelArmed || atBottom) box.scrollTop = box.scrollHeight;
  if (panelArmed && canReply) document.getElementById('transcript-input').focus();
  panelArmed = false;
}

async function refreshTranscript() {
  if (!panelKey) return;
  try {
    const res = await fetch('/transcript?key=' + encodeURIComponent(panelKey));
    if (!res.ok) {
      document.getElementById('transcript-note').textContent = 'Transcript unavailable for this agent.';
      document.getElementById('transcript-pages').innerHTML = '';
      return;
    }
    const data = await res.json();
    if (data.key !== panelKey) return;
    paintTranscript(data);
  } catch {
    document.getElementById('transcript-note').textContent = 'Could not load transcript.';
  }
}

function openPanel(key) {
  panelKey = key;
  panelArmed = true;
  document.getElementById('transcript-reply-error').textContent = '';
  showPanel();
  document.getElementById('transcript-pages').innerHTML = '';
  document.getElementById('transcript-note').textContent = 'Loading…';
  if (viewMode === 'tree') renderTree();
  graphSyncSelection();
  refreshTranscript();
  clearInterval(panelTimer);
  panelTimer = setInterval(refreshTranscript, 1500);
}

function closePanel() {
  const el = document.getElementById('transcript-panel');
  if (el.hidden || el.classList.contains('panel-motion-out')) return;
  cancelRenameEdit();
  panelKey = null;
  clearInterval(panelTimer);
  if (viewMode === 'tree') renderTree();
  graphSyncSelection();
  if (prefersReducedMotion()) {
    finishPanelHidden();
    return;
  }
  el.classList.remove('panel-visible', 'panel-motion-in');
  void el.offsetWidth;
  el.classList.add('panel-motion-out');
  const onOut = (e) => {
    if (e.target !== el || e.animationName !== 'panel-out') return;
    el.removeEventListener('animationend', onOut);
    if (panelCloseTimer) { clearTimeout(panelCloseTimer); panelCloseTimer = null; }
    finishPanelHidden();
  };
  el.addEventListener('animationend', onOut);
  panelCloseTimer = setTimeout(() => {
    panelCloseTimer = null;
    el.removeEventListener('animationend', onOut);
    if (!el.hidden) finishPanelHidden();
  }, PANEL_MOTION_MS + 80);
}

// ---------- waiting chime ----------
const prevVisualByKey = new Map();
let audioCtx = null;
let audioUnlocked = false;

function ensureAudioContext() {
  if (!audioCtx) audioCtx = new AudioContext();
  return audioCtx;
}

function unlockAudio() {
  if (audioUnlocked) return;
  try {
    const ctx = ensureAudioContext();
    if (ctx.state === 'running') { audioUnlocked = true; return; }
    ctx.resume().then(() => { if (ctx.state === 'running') audioUnlocked = true; }).catch(() => {});
  } catch (_) {}
}
document.addEventListener('click', unlockAudio);
document.addEventListener('keydown', unlockAudio);

function playWaitingChime() {
  if (!audioUnlocked || !audioCtx || audioCtx.state !== 'running') return;
  const ctx = audioCtx;
  const t0 = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.value = 0.09;
  master.connect(ctx.destination);
  const freq = 252;
  const dur = 1.6;
  for (const p of [{ ratio: 1, amp: 1 }, { ratio: 2.08, amp: 0.38 }, { ratio: 2.71, amp: 0.22 }]) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * p.ratio, t0);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, p.amp), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }
}

function noteWaitingTransitions(seedOnly) {
  let ring = false;
  for (const a of snap.agents || []) {
    const st = visualState(a);
    const prev = prevVisualByKey.get(a.key);
    if (!seedOnly && prev !== undefined && prev !== 'waiting' && st === 'waiting') ring = true;
    prevVisualByKey.set(a.key, st);
  }
  for (const key of prevVisualByKey.keys()) {
    if (!(snap.agents || []).some(a => a.key === key)) prevVisualByKey.delete(key);
  }
  if (ring) playWaitingChime();
}

// ---------- force-directed graph ----------
const CLOUD_HUB = '__cloud_hub__';
const graphPos = new Map();
const graphCanvas = document.getElementById('graph-canvas');
const graphCtx = graphCanvas.getContext('2d');
const graphWrap = document.getElementById('graph-wrap');
let graphNodes = [];
let graphEdges = [];
let graphSimActive = true;
let graphCamera = { x: 0, y: 0, scale: 1 };
let graphHoverId = null;
let graphHighlight = null;
let graphDragId = null;
let graphPan = null;
let graphPulse = 0;
let graphNeedsFit = true;
let graphLastSnapSig = '';
let graphResizeObs = null;

function visibleAgentKeys() {
  const keys = new Set();
  for (const row of buildTree(tierPool(tier))) {
    if (row.agent && !row.agent.kindOrphan && row.agent.key) keys.add(row.agent.key);
  }
  return keys;
}

function graphNodeRadius(n) {
  if (n.kind === 'project') return 10;
  if (n.kind === 'hub') return 12;
  if (n.agent?.kind === 'session') return 16;
  return 11;
}

function ensureGraphPos(id, nearId) {
  if (graphPos.has(id)) return graphPos.get(id);
  const near = nearId ? graphPos.get(nearId) : null;
  const ang = Math.random() * Math.PI * 2;
  const dist = near ? 36 + Math.random() * 28 : Math.random() * 40;
  const p = {
    x: (near?.x ?? 0) + Math.cos(ang) * dist,
    y: (near?.y ?? 0) + Math.sin(ang) * dist,
    vx: 0,
    vy: 0,
    pinned: false,
  };
  graphPos.set(id, p);
  return p;
}

function buildGraphModel() {
  const keys = visibleAgentKeys();
  const pool = tierPool(tier);
  const agents = pool.filter(a => keys.has(a.key));
  const nodes = [];
  const edges = [];
  const nodeIds = new Set();
  const addNode = (id, kind, agent, label) => {
    if (nodeIds.has(id)) return;
    nodeIds.add(id);
    nodes.push({ id, kind, agent: agent || null, label: label || id });
  };
  const addEdge = (a, b, len = 72) => {
    if (!a || !b || a === b) return;
    edges.push({ a, b, len });
  };

  const projects = new Map();
  for (const a of agents.filter(x => x.kind === 'session')) {
    const pk = projectGroupKey(a);
    if (!projects.has(pk)) projects.set(pk, []);
    projects.get(pk).push(a);
  }
  for (const [pk, sessions] of projects) {
    const hubId = pk === CLOUD_GROUP ? CLOUD_HUB : `project:${pk}`;
    addNode(hubId, pk === CLOUD_GROUP ? 'hub' : 'project', null, groupLabel(pk));
    for (const s of sessions) {
      addNode(s.key, 'agent', s, titleOf(s));
      addEdge(hubId, s.key, 90);
    }
  }

  for (const a of agents.filter(x => x.kind === 'subagent')) {
    addNode(a.key, 'agent', a, titleOf(a));
    const parent = a.parentKey && keys.has(a.parentKey) ? a.parentKey
      : (keys.has(a.sessionKey) ? a.sessionKey : null);
    if (parent) addEdge(parent, a.key, 64);
    else if (a.sessionKey && keys.has(a.sessionKey)) addEdge(a.sessionKey, a.key, 64);
  }

  const linkedCloud = new Set();
  for (const a of agents.filter(x => x.source === 'cloud' && x.kind === 'session')) {
    addNode(a.key, 'agent', a, titleOf(a));
    if (a.parentKey && (keys.has(a.parentKey) || nodeIds.has(a.parentKey))) {
      addEdge(a.parentKey, a.key, 80);
      linkedCloud.add(a.key);
    }
  }
  const orphanCloud = agents.filter(x => x.source === 'cloud' && x.kind === 'session' && !linkedCloud.has(x.key));
  if (orphanCloud.length) {
    addNode(CLOUD_HUB, 'hub', null, THEME.groupCloud);
    for (const c of orphanCloud) {
      if (!nodeIds.has(c.key)) addNode(c.key, 'agent', c, titleOf(c));
      addEdge(CLOUD_HUB, c.key, 88);
    }
  }

  for (const n of nodes) {
    const near = graphEdgesParent(n.id, edges);
    ensureGraphPos(n.id, near);
  }
  return { nodes, edges };
}

function graphEdgesParent(id, edges) {
  for (const e of edges) if (e.b === id) return e.a;
  return null;
}

function syncGraphFromSnap() {
  if (viewMode !== 'graph') return;
  const sig = `${tier}|${searchQuery}|${showFinished}|${(snap.agents || []).length}|${(snap.departed || []).length}`;
  const rebuilt = sig !== graphLastSnapSig;
  graphLastSnapSig = sig;
  const model = buildGraphModel();
  graphNodes = model.nodes;
  graphEdges = model.edges;
  document.getElementById('graph-empty').hidden = graphNodes.length > 0;
  for (const n of graphNodes) ensureGraphPos(n.id, graphEdgesParent(n.id, graphEdges));
  for (const id of [...graphPos.keys()]) {
    if (!graphNodes.some(n => n.id === id)) graphPos.delete(id);
  }
  if (rebuilt) graphSimActive = true;
  if (graphNeedsFit && graphNodes.length) { fitGraphView(); graphNeedsFit = false; }
  centerGraphOnSearch();
}

function graphSyncSelection() {
  graphHighlight = panelKey;
}

function truncateLabel(s, max = 28) {
  s = String(s || '');
  return s.length <= max ? s : s.slice(0, max - 1) + '…';
}

function graphWorldToScreen(wx, wy) {
  const dpr = window.devicePixelRatio || 1;
  const w = graphCanvas.width / dpr;
  const h = graphCanvas.height / dpr;
  return {
    x: (wx - graphCamera.x) * graphCamera.scale + w / 2,
    y: (wy - graphCamera.y) * graphCamera.scale + h / 2,
  };
}

function graphScreenToWorld(sx, sy) {
  const dpr = window.devicePixelRatio || 1;
  const w = graphCanvas.width / dpr;
  const h = graphCanvas.height / dpr;
  return {
    x: (sx - w / 2) / graphCamera.scale + graphCamera.x,
    y: (sy - h / 2) / graphCamera.scale + graphCamera.y,
  };
}

function fitGraphView() {
  if (!graphNodes.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of graphNodes) {
    const p = graphPos.get(n.id);
    if (!p) continue;
    const r = graphNodeRadius(n) + 8;
    minX = Math.min(minX, p.x - r); maxX = Math.max(maxX, p.x + r);
    minY = Math.min(minY, p.y - r); maxY = Math.max(maxY, p.y + r);
  }
  const dpr = window.devicePixelRatio || 1;
  const w = graphCanvas.width / dpr;
  const h = graphCanvas.height / dpr;
  const bw = maxX - minX || 1;
  const bh = maxY - minY || 1;
  graphCamera.x = (minX + maxX) / 2;
  graphCamera.y = (minY + maxY) / 2;
  graphCamera.scale = Math.min(2.5, Math.max(0.35, 0.85 * Math.min(w / bw, h / bh)));
}

let graphLastSearchQ = '';
function centerGraphOnSearch() {
  const q = searchQuery.trim().toLowerCase();
  if (q === graphLastSearchQ) return;
  graphLastSearchQ = q;
  if (!q || viewMode !== 'graph') return;
  for (const n of graphNodes) {
    if (n.agent && matchesSearch(n.agent, q)) {
      const p = graphPos.get(n.id);
      if (p) { graphCamera.x = p.x; graphCamera.y = p.y; }
      break;
    }
  }
}

function graphSimStep() {
  if (!graphSimActive || graphNodes.length < 2) return;
  const repulse = 520;
  const damp = 0.82;
  let energy = 0;
  for (let i = 0; i < graphNodes.length; i++) {
    const ni = graphNodes[i];
    const pi = graphPos.get(ni.id);
    if (!pi || pi.pinned) continue;
    for (let j = i + 1; j < graphNodes.length; j++) {
      const pj = graphPos.get(graphNodes[j].id);
      if (!pj) continue;
      let dx = pj.x - pi.x;
      let dy = pj.y - pi.y;
      let d2 = dx * dx + dy * dy + 0.01;
      const f = repulse / d2;
      const fx = (dx / Math.sqrt(d2)) * f;
      const fy = (dy / Math.sqrt(d2)) * f;
      pi.vx -= fx; pi.vy -= fy;
      if (!pj.pinned) { pj.vx += fx; pj.vy += fy; }
    }
  }
  for (const e of graphEdges) {
    const pa = graphPos.get(e.a);
    const pb = graphPos.get(e.b);
    if (!pa || !pb) continue;
    let dx = pb.x - pa.x;
    let dy = pb.y - pa.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const force = (dist - e.len) * 0.025;
    const fx = (dx / dist) * force;
    const fy = (dy / dist) * force;
    if (!pa.pinned) { pa.vx += fx; pa.vy += fy; }
    if (!pb.pinned) { pb.vx -= fx; pb.vy -= fy; }
  }
  for (const n of graphNodes) {
    const p = graphPos.get(n.id);
    if (!p || p.pinned) continue;
    p.vx += -p.x * 0.002;
    p.vy += -p.y * 0.002;
    p.vx *= damp;
    p.vy *= damp;
    p.x += p.vx;
    p.y += p.vy;
    energy += p.vx * p.vx + p.vy * p.vy;
  }
  if (energy < 0.08) graphSimActive = false;
}

function graphNeighborSet(id) {
  const s = new Set([id]);
  for (const e of graphEdges) {
    if (e.a === id) s.add(e.b);
    if (e.b === id) s.add(e.a);
  }
  return s;
}

function graphStateRing(agent, t) {
  if (!agent) return null;
  const st = visualState(agent);
  if (st === 'done') return { color: '#6b7280', width: 1.5, pulse: false, dim: true };
  if (st === 'stuck') return { color: '#ff6b6b', width: 2.5, pulse: false };
  if (st === 'waiting') {
    const c = agent.summons === 'question' ? '#ffb86b' : '#ffd166';
    return { color: c, width: 3, pulse: true };
  }
  if (['typing', 'reading', 'running', 'delegating', 'thinking'].includes(st)) {
    return { color: '#6b9fff', width: 2, pulse: true, soft: true };
  }
  if (st === 'idle') return { color: '#8b939e', width: 1.5, pulse: false };
  return null;
}

function drawGraphFrame(t) {
  if (viewMode !== 'graph') return;
  graphPulse = t * 0.001;
  resizeGraphCanvas();
  if (graphNodes.length) graphSimStep();
  const dpr = window.devicePixelRatio || 1;
  const w = graphCanvas.width / dpr;
  const h = graphCanvas.height / dpr;
  graphCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  graphCtx.fillStyle = '#12141a';
  graphCtx.fillRect(0, 0, w, h);
  if (!graphNodes.length) return;

  const q = searchQuery.trim().toLowerCase();
  const hoverSet = graphHoverId ? graphNeighborSet(graphHoverId) : null;
  const matchIds = new Set();
  if (q) for (const n of graphNodes) if (n.agent && matchesSearch(n.agent, q)) matchIds.add(n.id);

  graphCtx.lineWidth = 1;
  for (const e of graphEdges) {
    const pa = graphPos.get(e.a);
    const pb = graphPos.get(e.b);
    if (!pa || !pb) continue;
    const sa = graphWorldToScreen(pa.x, pa.y);
    const sb = graphWorldToScreen(pb.x, pb.y);
    const fade = hoverSet && !(hoverSet.has(e.a) && hoverSet.has(e.b));
    graphCtx.strokeStyle = fade ? 'rgba(80, 90, 110, 0.25)' : 'rgba(120, 140, 180, 0.55)';
    graphCtx.beginPath();
    graphCtx.moveTo(sa.x, sa.y);
    graphCtx.lineTo(sb.x, sb.y);
    graphCtx.stroke();
  }

  for (const n of graphNodes) {
    const p = graphPos.get(n.id);
    if (!p) continue;
    const sc = graphWorldToScreen(p.x, p.y);
    const r = graphNodeRadius(n) * Math.max(0.6, Math.min(1.4, graphCamera.scale * 0.5 + 0.5));
    let alpha = 1;
    if (hoverSet && !hoverSet.has(n.id)) alpha = 0.22;
    if (q && matchIds.size && !matchIds.has(n.id) && !(n.agent && matchesSearch(n.agent, q))) alpha *= 0.35;
    if (panelKey && n.agent?.key === panelKey) alpha = 1;

    const fill = n.agent ? sourceTheme(n.agent.source).badge
      : (n.kind === 'hub' ? '#9b6bd4' : '#5a6270');
    graphCtx.globalAlpha = n.agent && visualState(n.agent) === 'done' ? alpha * 0.55 : alpha;
    graphCtx.fillStyle = fill;
    graphCtx.beginPath();
    graphCtx.arc(sc.x, sc.y, r, 0, Math.PI * 2);
    graphCtx.fill();

    const ring = graphStateRing(n.agent, t);
    if (ring) {
      graphCtx.globalAlpha = alpha;
      graphCtx.strokeStyle = ring.color;
      graphCtx.lineWidth = ring.width;
      if (ring.pulse) {
        const pulse = ring.soft ? 2 + Math.sin(graphPulse * 4) * 1.5 : 3 + Math.sin(graphPulse * 5) * 2;
        graphCtx.lineWidth = pulse;
      }
      graphCtx.beginPath();
      graphCtx.arc(sc.x, sc.y, r + 3, 0, Math.PI * 2);
      graphCtx.stroke();
    }
    graphCtx.globalAlpha = 1;

    const showLabel = n.agent?.kind === 'session' || n.id === graphHoverId || matchIds.has(n.id);
    if (showLabel) {
      graphCtx.font = `${n.agent?.kind === 'session' ? '600' : '400'} 11px ${getComputedStyle(document.body).fontFamily}`;
      graphCtx.fillStyle = `rgba(232, 234, 237, ${alpha})`;
      graphCtx.textAlign = 'center';
      graphCtx.textBaseline = 'top';
      graphCtx.fillText(truncateLabel(n.label, n.agent?.kind === 'session' ? 36 : 24), sc.x, sc.y + r + 4);
    }
  }
  graphCtx.globalAlpha = 1;
}

function resizeGraphCanvas() {
  if (!graphWrap) return;
  const dpr = window.devicePixelRatio || 1;
  const w = graphWrap.clientWidth;
  const h = graphWrap.clientHeight;
  if (w < 2 || h < 2) return;
  if (graphCanvas.width !== Math.round(w * dpr) || graphCanvas.height !== Math.round(h * dpr)) {
    graphCanvas.width = Math.round(w * dpr);
    graphCanvas.height = Math.round(h * dpr);
    graphNeedsFit = true;
  }
}

function graphPickNode(sx, sy) {
  let hit = null;
  let best = Infinity;
  for (const n of graphNodes) {
    const p = graphPos.get(n.id);
    if (!p || !n.agent) continue;
    const sc = graphWorldToScreen(p.x, p.y);
    const r = graphNodeRadius(n) + 4;
    const d2 = (sc.x - sx) ** 2 + (sc.y - sy) ** 2;
    if (d2 <= r * r && d2 < best) { hit = n; best = d2; }
  }
  return hit;
}

function renderGraphLegend() {
  const el = document.getElementById('graph-legend');
  if (el.dataset.ready) return;
  el.dataset.ready = '1';
  const rows = [
    ...Object.entries(THEME.sources).map(([k, v]) =>
      `<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span class="dot" style="background:${v.badge}"></span>${esc(v.label)}</div>`),
    `<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span class="ring" style="border-color:#6b9fff"></span>Working</div>`,
    `<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span class="ring" style="border-color:#ffd166"></span>Waiting on you</div>`,
    `<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span class="ring" style="border-color:#ff6b6b"></span>Stuck</div>`,
  ];
  el.innerHTML = rows.join('');
}

function graphPointerPos(e) {
  const rect = graphCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function graphLoop(t) {
  drawGraphFrame(t);
  requestAnimationFrame(graphLoop);
}

// ---------- events ----------
document.getElementById('app-title').textContent = THEME.appTitle;
renderGraphLegend();
document.getElementById('transcript-close').addEventListener('click', closePanel);
document.getElementById('transcript-rename-btn').addEventListener('click', startRenameEdit);
document.getElementById('transcript-rename-input').addEventListener('keydown', async (e) => {
  if (e.key === 'Escape') { e.stopPropagation(); cancelRenameEdit(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (!panelKey) return;
  try {
    await postRename(panelKey, e.target.value);
    cancelRenameEdit();
  } catch (err) {
    document.getElementById('transcript-note').textContent = String(err.message || err);
  }
});
document.getElementById('transcript-reset-name').addEventListener('click', async () => {
  if (!panelKey) return;
  try {
    await postRename(panelKey, '');
    cancelRenameEdit();
  } catch (err) {
    document.getElementById('transcript-note').textContent = String(err.message || err);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (renameEditing) { cancelRenameEdit(); return; }
  if (panelKey) closePanel();
});
const ctxMenu = document.getElementById('agent-ctx-menu');
function showAgentContextMenu(x, y, key) {
  ctxMenu.dataset.key = key;
  ctxMenu.hidden = false;
  ctxMenu.style.left = `${x}px`;
  ctxMenu.style.top = `${y}px`;
}
document.addEventListener('click', () => { ctxMenu.hidden = true; });
ctxMenu.querySelector('[data-action=rename]').addEventListener('click', (e) => {
  e.stopPropagation();
  const key = ctxMenu.dataset.key;
  ctxMenu.hidden = true;
  if (key) beginRenameForKey(key);
});
document.getElementById('tree-body').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-key]');
  if (tr?.dataset.key) openPanel(tr.dataset.key);
});
document.getElementById('tree-body').addEventListener('dblclick', (e) => {
  const tr = e.target.closest('tr[data-key]');
  const td = e.target.closest('td');
  if (!tr?.dataset.key || !td || td.cellIndex !== 2) return;
  e.preventDefault();
  beginRenameForKey(tr.dataset.key);
});
document.getElementById('tree-body').addEventListener('contextmenu', (e) => {
  const tr = e.target.closest('tr[data-key]');
  if (!tr?.dataset.key) return;
  e.preventDefault();
  showAgentContextMenu(e.clientX, e.clientY, tr.dataset.key);
});
document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  graphLastSnapSig = '';
  graphLastSearchQ = '';
  if (viewMode === 'tree') renderTree();
  else syncGraphFromSnap();
});
document.getElementById('show-finished').addEventListener('change', (e) => {
  showFinished = e.target.checked;
  graphLastSnapSig = '';
  if (viewMode === 'tree') renderTree();
  else syncGraphFromSnap();
});
for (const tab of document.querySelectorAll('.tier-tab')) {
  tab.addEventListener('click', () => setTier(tab.dataset.tier));
}
for (const tab of document.querySelectorAll('.view-mode-tab')) {
  tab.addEventListener('click', () => setViewMode(tab.dataset.view));
}
document.getElementById('graph-fit').addEventListener('click', () => { fitGraphView(); graphSimActive = false; });

graphCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const { x, y } = graphPointerPos(e);
  const before = graphScreenToWorld(x, y);
  const factor = e.deltaY < 0 ? 1.08 : 0.92;
  graphCamera.scale = Math.min(3, Math.max(0.25, graphCamera.scale * factor));
  const after = graphScreenToWorld(x, y);
  graphCamera.x += before.x - after.x;
  graphCamera.y += before.y - after.y;
}, { passive: false });

graphCanvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const { x, y } = graphPointerPos(e);
  const hit = graphPickNode(x, y);
  if (hit) {
    graphDragId = hit.id;
    const p = graphPos.get(hit.id);
    if (p) { p.pinned = true; graphSimActive = true; }
    return;
  }
  graphPan = { sx: x, sy: y, cx: graphCamera.x, cy: graphCamera.y };
  graphWrap.classList.add('panning');
});
function graphPointerFromEvent(e) {
  const rect = graphCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
window.addEventListener('mousemove', (e) => {
  const { x, y } = graphPointerFromEvent(e);
  if (graphDragId) {
    const w = graphScreenToWorld(x, y);
    const p = graphPos.get(graphDragId);
    if (p) { p.x = w.x; p.y = w.y; p.vx = 0; p.vy = 0; graphSimActive = true; }
    return;
  }
  if (graphPan) {
    const dx = (x - graphPan.sx) / graphCamera.scale;
    const dy = (y - graphPan.sy) / graphCamera.scale;
    graphCamera.x = graphPan.cx - dx;
    graphCamera.y = graphPan.cy - dy;
  }
});
graphCanvas.addEventListener('mousemove', (e) => {
  if (graphDragId || graphPan) return;
  const { x, y } = graphPointerPos(e);
  const hit = graphPickNode(x, y);
  graphHoverId = hit?.id ?? null;
});
graphCanvas.addEventListener('mouseleave', () => { graphHoverId = null; });
window.addEventListener('mouseup', () => {
  if (graphDragId) {
    const p = graphPos.get(graphDragId);
    if (p) p.pinned = false;
    graphDragId = null;
  }
  graphPan = null;
  graphWrap.classList.remove('panning');
});
graphCanvas.addEventListener('click', (e) => {
  const { x, y } = graphPointerPos(e);
  const hit = graphPickNode(x, y);
  if (hit?.agent?.key) openPanel(hit.agent.key);
});
graphCanvas.addEventListener('dblclick', (e) => {
  e.stopPropagation();
  const { x, y } = graphPointerPos(e);
  const hit = graphPickNode(x, y);
  if (hit?.agent?.key) { beginRenameForKey(hit.agent.key); return; }
  fitGraphView();
  graphSimActive = false;
});
graphCanvas.addEventListener('contextmenu', (e) => {
  const { x, y } = graphPointerPos(e);
  const hit = graphPickNode(x, y);
  if (!hit?.agent?.key) return;
  e.preventDefault();
  showAgentContextMenu(e.clientX, e.clientY, hit.agent.key);
});
graphWrap.addEventListener('dblclick', (e) => {
  if (e.target !== graphWrap) return;
  fitGraphView();
  graphSimActive = false;
});

if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => {
    if (viewMode === 'graph') resizeGraphCanvas();
  }).observe(graphWrap);
}
requestAnimationFrame(graphLoop);
document.getElementById('transcript-reply').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('transcript-input');
  const text = input.value.trim();
  const err = document.getElementById('transcript-reply-error');
  if (!text || !panelKey) return;
  err.textContent = '';
  try {
    const res = await fetch('/reply', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key: panelKey, text }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { err.textContent = data.error || 'Reply failed.'; return; }
    input.value = '';
    refreshTranscript();
  } catch {
    err.textContent = 'Reply failed.';
  }
});

const statusEl = document.getElementById('live-status');
function connect() {
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    snap = JSON.parse(e.data);
    if (!Array.isArray(snap.departed)) snap.departed = [];
    if (!Array.isArray(snap.graveyard)) snap.graveyard = [];
    if (!snap.cloud) snap.cloud = {};
    noteWaitingTransitions(!window._loadedOnce);
    renderAll();
    window._loadedOnce = true;
  };
  es.onerror = () => { statusEl.textContent = 'Disconnected — is server.mjs running? Retrying…'; };
}
connect();
setViewMode('graph');
</script>
</body>
</html>
